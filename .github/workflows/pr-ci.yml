name: PR CI

on:
  pull_request:
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.head_ref || github.run_id }}
  cancel-in-progress: true

jobs:
  test-linux:
    name: Test & Typecheck (Ubuntu)
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install LibreOffice (PPA) and system tools
        run: |
          sudo add-apt-repository -y ppa:libreoffice/ppa
          sudo apt-get update
          sudo apt-get install -y libreoffice python3-uno gettext

      - name: Install Opengrep
        run: |
          curl -fsSL https://raw.githubusercontent.com/opengrep/opengrep/main/install.sh | bash
          echo "$HOME/.local/bin" >> $GITHUB_PATH

      - name: Install uv
        uses: astral-sh/setup-uv@v5
        with:
          version: "latest"
          enable-cache: true

      - name: Set up Python 3.13
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      - name: Install Python dependencies
        run: |
          uv sync --dev

      - name: Prepare build artifacts (manifest, vendor, translations)
        run: |
          make vendor manifest compile-translations

      - name: Run typecheck
        run: |
          make typecheck

      - name: Run tests (Pytest + UNO)
        run: |
          make test

      - name: Verify Extension Builds & Packaging Lifecycles (WriterAgent, LibrePy, LibreHarper)
        run: |
          # 1. Build and install WriterAgent
          make build
          make register-built-oxt
          unopkg list | grep -q "org.extension.writeragent"

          # 2. Build and install LibrePy (removes WriterAgent as both share addin namespace)
          make build-core
          make register-librepy-oxt
          unopkg list | grep -q "org.extension.librepy"

          # 3. Build and install LibreHarper
          make build-harper
          make register-libreharper-oxt
          unopkg list | grep -q "org.extension.libreharper"

          # 4. Clean up installed packages
          unopkg remove org.extension.libreharper || true
          unopkg remove org.extension.librepy || true
          unopkg remove org.extension.writeragent || true
